[project]
name = "datamate-baseline"
version = "0.0.1"
description = "Offline DataMate baseline with an opt-in local S1 planner"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.22", "packaging==26.3"]
llm = ["llama-cpp-python==0.3.16"]
gpu = [
    "torch==2.6.0+cu124",
    "numpy==2.4.6",
    "nvidia-cublas-cu12==12.4.5.8",
    "nvidia-cuda-cupti-cu12==12.4.127",
    "nvidia-cuda-nvrtc-cu12==12.4.127",
    "nvidia-cuda-runtime-cu12==12.4.127",
    "nvidia-cudnn-cu12==9.1.0.70",
    "nvidia-cufft-cu12==11.2.1.3",
    "nvidia-curand-cu12==10.3.5.147",
    "nvidia-cusolver-cu12==11.6.1.9",
    "nvidia-cusparse-cu12==12.3.1.170",
    "nvidia-cusparselt-cu12==0.6.2",
    "nvidia-nccl-cu12==2.21.5",
    "nvidia-nvjitlink-cu12==12.4.127",
    "nvidia-nvtx-cu12==12.4.127",
    "sympy==1.13.1",
    "triton==3.2.0",
]

[tool.uv]
package = false
link-mode = "copy"
default-groups = ["dev", "gpu"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
nvidia-cublas-cu12 = { index = "pytorch-cu124" }
nvidia-cuda-cupti-cu12 = { index = "pytorch-cu124" }
nvidia-cuda-nvrtc-cu12 = { index = "pytorch-cu124" }
nvidia-cuda-runtime-cu12 = { index = "pytorch-cu124" }
nvidia-cudnn-cu12 = { index = "pytorch-cu124" }
nvidia-cufft-cu12 = { index = "pytorch-cu124" }
nvidia-curand-cu12 = { index = "pytorch-cu124" }
nvidia-cusolver-cu12 = { index = "pytorch-cu124" }
nvidia-cusparse-cu12 = { index = "pytorch-cu124" }
nvidia-cusparselt-cu12 = { index = "pytorch-cu124" }
nvidia-nccl-cu12 = { index = "pytorch-cu124" }
nvidia-nvjitlink-cu12 = { index = "pytorch-cu124" }
nvidia-nvtx-cu12 = { index = "pytorch-cu124" }
sympy = { index = "pytorch-cu124" }
triton = { index = "pytorch-cu124" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["dataset", "reports", ".artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
