# Tool configuration only. Dependencies: requirements.txt (image runtime) and
# requirements-dev.txt (local .venv tools).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["dataset", ".artifacts", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
